services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: colombiando
      MYSQL_USER: colombiando
      MYSQL_PASSWORD: colombiando
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./seed-data.sql:/docker-entrypoint-initdb.d/backup.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  apache:
    build:
      context: ./apache
    ports:
      - "8081:80"
    depends_on:
      - frontend

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/colombiando?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: colombiando
      SPRING_DATASOURCE_PASSWORD: colombiando
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /api
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  mysql_data:
